[package]
name = "spore-core"
version = "0.0.0"
edition = "2021"
description = "spore-core harness runtime library"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
thiserror = "1.0"
futures-core = "0.3"
futures-util = "0.3"
trait-variant = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "fs", "process", "io-util"] }
async-stream = "0.3"
glob = "0.3"
regex = "1"
walkdir = "2"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.11.0"
# Multimodal image input: base64-encode image bytes for the Content::Image data
# the vision adapters (Anthropic image source / OpenAI image_url) forward.
base64 = "0.22"
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["grpc-tonic", "trace"] }
# MicroVM isolation backend (feature `petri`): the sibling petri sandbox
# runtime. Pinned to a rev until petri publishes to crates.io; macOS/Apple-silicon
# only at runtime, but the crate itself builds everywhere. NOTE: cargo resolves
# path/git deps even when the feature is OFF, so this must stay fetchable by a
# bare CI runner — a local path breaks anyone without a sibling checkout, and an
# ssh:// URL needs a key the runner does not have. petri is public, so https
# fetches anonymously with no credentials.
petri = { git = "https://github.com/squirrelsoft-dev/petri.git", rev = "0e56420f2066b4766385250436361ee96e2296da", optional = true }

# Process-group kill for `execute_command` timeouts/aborts (kill(-pgid)):
# tokio's kill_on_drop only reaps the DIRECT child, orphaning grandchildren
# (npm → node). Unix-only; Windows has no process groups in this sense.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
test-utils = []
# MicroVM isolation via the petri sandbox runtime. Enables
# `sandbox_petri::PetriSandboxProvider`, which executes commands inside a
# petri microVM while file tools stay host-side over the shared workspace.
petri = ["dep:petri"]
# Gates the two named safety footguns `Mode::Yolo` and `IsolationMode::None`.
# When this feature is OFF (the default), those variants do not exist, so any
# attempt to use them is a compile error rather than a runtime warning. Intended
# for benchmarking and local development only — do not enable in production.
dangerous = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
spore-core = { path = ".", features = ["test-utils"] }
tempfile = "3"
wiremock = "0.6"
