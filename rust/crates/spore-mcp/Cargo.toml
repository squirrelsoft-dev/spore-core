[package]
name = "spore-mcp"
version = "0.0.0"
edition = "2021"
description = "MCP (Model Context Protocol) client tools for spore-core"
license = "MIT"

[dependencies]
spore-core = { path = "../spore-core" }
rmcp = { version = "1.7", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
tokio = { version = "1", features = ["sync", "rt", "process"] }
http = "1"
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
